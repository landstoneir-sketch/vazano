name: vazano-production

services:
  config-check:
    image: ${VAZANO_API_IMAGE:?VAZANO_API_IMAGE must be set to an immutable release image}
    env_file:
      - ${VAZANO_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/src/config/validate-environment-cli.js"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    profiles: [operations]

  migration:
    image: ${VAZANO_MIGRATION_IMAGE:?VAZANO_MIGRATION_IMAGE must be set to an immutable release image}
    env_file:
      - ${VAZANO_ENV_FILE:-.env.production}
    command: ["npm", "run", "prisma:deploy"]
    restart: "no"
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    profiles: [operations]

  bootstrap:
    image: ${VAZANO_MIGRATION_IMAGE:?VAZANO_MIGRATION_IMAGE must be set to an immutable release image}
    env_file:
      - ${VAZANO_ENV_FILE:-.env.production}
    command: ["npm", "run", "prisma:seed"]
    restart: "no"
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    profiles: [operations]

  legal-publisher:
    image: ${VAZANO_API_IMAGE:?VAZANO_API_IMAGE must be set to an immutable release image}
    env_file:
      - ${VAZANO_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/src/operations/publish-legal-pages.js"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    profiles: [operations]

  api:
    image: ${VAZANO_API_IMAGE:?VAZANO_API_IMAGE must be set to an immutable release image}
    env_file:
      - ${VAZANO_ENV_FILE:-.env.production}
    expose: ["3001"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav-debian:1.4.3@sha256:1d261f9c83ef2bbeef3915c7792f125e5707500fde0019d53547461747b90374
    environment:
      TZ: Asia/Tehran
    volumes:
      - clamav-data:/var/lib/clamav
    expose: ["3310"]
    restart: unless-stopped
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 10 127.0.0.1 3310 | grep -qx PONG"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  web:
    image: ${VAZANO_WEB_IMAGE:?VAZANO_WEB_IMAGE must be set to an immutable release image}
    environment:
      API_INTERNAL_URL: http://api:3001/v1
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: ${VAZANO_GATEWAY_IMAGE:?VAZANO_GATEWAY_IMAGE must be set to an approved pinned Nginx image}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [application]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

networks:
  application:
    driver: bridge

volumes:
  clamav-data:
