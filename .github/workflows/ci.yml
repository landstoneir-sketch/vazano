name: Quality gate

on:
  pull_request:
  push:
    branches: [main, "rebuild/**"]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate database schema
        run: npm run prisma:validate --workspace @vazano/api

      - name: Generate database client
        run: npm run prisma:generate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build applications
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production deployment manifest
        env:
          VAZANO_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Build web runtime image
        run: docker build --target web-runner --tag vazano-web:${{ github.sha }} .

      - name: Build API runtime image
        run: docker build --target api-runner --tag vazano-api:${{ github.sha }} .

      - name: Build migration runtime image
        run: docker build --target migration-runner --tag vazano-migration:${{ github.sha }} .

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vazano
          POSTGRES_USER: vazano
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vazano -d vazano"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      TZ: Asia/Tehran
      API_PORT: 3101
      WEB_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3101/v1
      API_INTERNAL_URL: http://localhost:3101/v1
      DATABASE_URL: postgresql://vazano:ci_only_password@localhost:5432/vazano?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_TTL_DAYS: 30
      OTP_TTL_SECONDS: 120
      OTP_MAX_ATTEMPTS: 5
      OTP_PEPPER: ci_only_long_otp_pepper_not_for_production
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: vazano-ci
      S3_ACCESS_KEY: vazano-ci
      S3_SECRET_KEY: ci_only_storage_secret
      S3_FORCE_PATH_STYLE: "true"
      FILE_SCAN_MODE: development-bypass
      PAYMENT_PROVIDER: zarinpal
      ZARINPAL_ENABLED: "false"
      ZARINPAL_SANDBOX: "true"
      PUBLIC_API_URL: http://localhost:3101
      SEED_ADMIN_MOBILE: "09120000000"
      SEED_DEMO_DATA: "true"
      NOTIFICATION_WORKER_ENABLED: "false"
      SUBSCRIPTION_LIFECYCLE_WORKER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare test database
        run: |
          npm run prisma:generate
          npm run prisma:deploy
          npm run prisma:seed

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run critical marketplace flow
        run: npm run test:e2e
