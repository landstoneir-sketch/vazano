name: vazano
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vazano}
      POSTGRES_USER: ${POSTGRES_USER:-vazano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vazano_local_only}
      TZ: Asia/Tehran
    ports: ["55432:5432"]
    volumes: ["vazano-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vazano} -d ${POSTGRES_DB:-vazano}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes: ["vazano-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-vazano}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-vazano_local_only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["59000:9000", "59001:9001"]
    volumes: ["vazano-minio:/data"]
    restart: unless-stopped
  clamav:
    image: clamav/clamav-debian:1.4.3@sha256:1d261f9c83ef2bbeef3915c7792f125e5707500fde0019d53547461747b90374
    environment:
      TZ: Asia/Tehran
    ports: ["53310:3310"]
    volumes: ["vazano-clamav:/var/lib/clamav"]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 10 127.0.0.1 3310 | grep -qx PONG"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s
    restart: unless-stopped
volumes:
  vazano-postgres:
  vazano-redis:
  vazano-minio:
  vazano-clamav:
